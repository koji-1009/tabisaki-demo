version: 2

updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: saturday
    time: "08:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  cooldown:
    default-days: 3
    semver-major-days: 7
  groups:
    astro:
      patterns:
      - "astro"
      - "@astrojs/*"
    react:
      patterns:
      - "react"
      - "react-dom"
      - "@types/react"
      - "@types/react-dom"

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: saturday
    time: "08:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  cooldown:
    default-days: 3
  groups:
    github-actions:
      patterns:
      - "actions/*"
